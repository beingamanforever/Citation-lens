name: checks and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts evals
      - run: ruff format --check src tests scripts evals
      - run: pytest -q
      - run: python scripts/package.py
      - run: git diff --exit-code
      - run: python -m build --no-isolation
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m build --no-isolation
      - name: Package plugin
        run: |
          python -c "import tomllib; from pathlib import Path; print('RELEASE_VERSION=' + tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])" >> "$GITHUB_ENV"
          git archive --format=zip --output=dist/citation-lens-plugin.zip HEAD plugin.json mcp.json .mcp.json .claude-plugin/plugin.json skills src scripts/search.py run.py requirements-runtime.txt README.md LICENSE docs
      - name: Publish new preview version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump pyproject.toml to publish another."
            exit 0
          fi
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Citation Lens $tag" --prerelease --notes-file docs/RELEASE.md
